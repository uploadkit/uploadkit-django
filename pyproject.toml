[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-django"
version = "0.1.1"
description = "Django integration for UploadKit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "django", "upload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.1.0",
    "Django>=4.2",
]

[project.optional-dependencies]
security = ["uploadkit-security>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage>=7.0",
    "uploadkit-testing>=0.1.0",
    "uploadkit-security>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-django"
Repository = "https://github.com/uploadkit/uploadkit-django"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_django"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
DJANGO_SETTINGS_MODULE = "tests.settings"
